services:
  reef:
    build:
      context: .
      args:
        REEF_VERSION: local
    image: reef:local
    init: true
    ports:
      - "${REEF_PORT:-8000}:8000"
    environment:
      REEF_ENVIRONMENT: local
      REEF_LOG_LEVEL: "${REEF_LOG_LEVEL:-INFO}"
    volumes:
      - reef-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  reef-data:
